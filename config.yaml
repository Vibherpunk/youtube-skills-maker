youtube_feed:
  browser: "chrome:Default"
  cookies_fallback: "cookies.txt"
  feeds:
    - "https://www.youtube.com/"
  limit_per_feed: 25
  min_duration_seconds: 180
  prioritize_ai_tech: true
  exclude_child_content: true

# Discovery source. "hackertube" scans Hacker News-recommended YouTube videos
# (the corpus behind hackertube.org, which serves no robots-permitted listing).
# Set source: "youtube_feed" to use the personal feed above instead.
hackertube:
  source: "hackertube"
  min_points: 10
  limit: 25
  max_pages: 6
  min_duration_seconds: 180
  # Candidates below this skill-potential score are dropped. 4.0 ≈ AI/tech
  # topic or a procedure-shaped title, not just a popular video.
  min_skill_score: 4.0
  exclude_child_content: true

pipeline:
  gemini_model: "gemini-2.5-flash"
  embedding_model: "gemini-embedding-2"
  transcript_language: "en"
  # Transcript cache is only needed within a run; prune it at the end so it
  # cannot grow unbounded. keep_last: 0 deletes all; set an N to retain recent.
  transcript_cache_keep_last: 0
  transcript_cache_max_mb: 0
  # Threshold for clustering similarity (cosine similarity)
  clustering_threshold: 0.75
  # Minimum number of videos in a cluster before triggering synthesis (unless solo_allowed is true)
  min_videos_in_cluster: 2
  # Whether a single high-quality video (skill potential >= 4) can be turned into a skill directly
  allow_solo_skills: true

github:
  repo: "Vibherpunk/ai-skills"
  branch: "main"
  skills_path: "skills/"
  commit_prefix: "feat(skills): "

# Second output: converted vercel-format skills for Vibherpunk/i-know-kung-fu.
ikf:
  repo: "Vibherpunk/i-know-kung-fu"
  local_path: "data/i-know-kung-fu"
  enabled: true

adapters:
  enabled:
    - antigravity
    - cursor
    - claude
    - copilot
    - windsurf
